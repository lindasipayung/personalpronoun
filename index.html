<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronoun Pop! Subject & Object Game</title>
<style>
:root{--bg:#fff4d6;--card:#fff;--ink:#2b2350;--a:#ff5d8f;--b:#3b82f6;--c:#22c55e;--d:#f59e0b;--bad:#ef4444;--soft:#f3ecff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--card:#2a2350;--ink:#fff4d6;--soft:#3a3170;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1838;--card:#2a2350;--ink:#fff4d6;--soft:#3a3170;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:640px;padding:14px;text-align:center}
h1{font-size:2rem;margin:6px 0;color:var(--a)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin:12px 0}
.mode{display:block;width:100%;border:0;border-radius:20px;padding:14px;margin:10px 0;font:inherit;font-size:1.2rem;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.mode small{display:block;font-size:.85rem;opacity:.95}
.mode:active,.opt:active{transform:translateY(3px);box-shadow:none}
.tog{display:flex;gap:8px;justify-content:center;align-items:center;font-size:1.05rem}
.tog button{border:3px solid var(--b);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;cursor:pointer}
.tog button.on{background:var(--b);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;gap:6px}
.pill{background:var(--soft);border-radius:999px;padding:6px 12px}
.bar{height:12px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--d),var(--a));transition:width .3s}
.emoji{font-size:4.2rem;line-height:1.1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.sent{font-size:1.6rem;font-weight:700;margin:8px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px dashed var(--a);color:var(--a)}
.blank.ok{color:var(--c);border-bottom-color:var(--c)}
.hint{font-size:1rem;opacity:.8;min-height:1.4em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:0;border-radius:18px;padding:16px 6px;font:inherit;font-size:1.5rem;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.o0{background:var(--a)}.o1{background:var(--b)}.o2{background:var(--c)}.o3{background:var(--d)}
.opt:disabled{opacity:.55;cursor:default}
.opt.right{outline:5px solid #16a34a;opacity:1}
.opt.wrong{animation:shake .4s;background:var(--bad)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:2em;font-size:1.3rem;font-weight:700;margin-top:10px}
.next{display:none;margin-top:8px;border:0;border-radius:16px;padding:12px 26px;background:var(--ink);color:var(--bg);font:inherit;font-size:1.2rem;cursor:pointer}
.teams{display:flex;gap:8px;margin-bottom:6px}
.team{flex:1;border-radius:16px;padding:6px;background:var(--soft);font-size:1.05rem;border:4px solid transparent}
.team.act{border-color:var(--a);background:var(--card)}
.stars{font-size:2.6rem;margin:6px 0}
.big{font-size:1.3rem}
.hide{display:none!important}
.pop{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.tip{background:var(--soft);border-radius:16px;padding:10px;font-size:1rem;text-align:left;margin-top:10px}
</style></head><body>
<div class="app">
<h1>🎈 Pronoun Pop! 🎈</h1>

<div id="home">
 <div class="card">
  <div class="big">Pick the right pronoun and pop the balloon!</div>
  <div class="tip">👦 <b>Subject</b> pronouns do the action: <b>I, you, he, she, it, we, they</b><br>🎁 <b>Object</b> pronouns get the action: <b>me, you, him, her, it, us, them</b></div>
 </div>
 <button class="mode" style="background:var(--b)" onclick="start('sub')">🏃 Subject Pronouns<small>I, he, she, we, they…</small></button>
 <button class="mode" style="background:var(--c)" onclick="start('obj')">🎁 Object Pronouns<small>me, him, her, us, them…</small></button>
 <button class="mode" style="background:var(--a)" onclick="start('mix')">🌈 Mix It Up!<small>Subject + Object together</small></button>
 <div class="card tog">
  <span>Players:</span>
  <button id="p1" class="on" onclick="setP(1)">1 Player</button>
  <button id="p2" onclick="setP(2)">2 Teams</button>
 </div>
</div>

<div id="game" class="hide">
 <div class="top"><span class="pill" id="qn">1/10</span><span class="pill" id="streak">🔥 0</span><span class="pill" id="score">⭐ 0</span></div>
 <div class="teams hide" id="teams"><div class="team" id="tA">🔴 Team A: <b id="sA">0</b></div><div class="team" id="tB">🔵 Team B: <b id="sB">0</b></div></div>
 <div class="bar"><i id="bar"></i></div>
 <div class="card">
  <div class="emoji" id="emo"></div>
  <div class="sent" id="sent"></div>
  <div class="hint" id="hint"></div>
  <div class="opts" id="opts"></div>
  <div class="msg" id="msg"></div>
  <button class="next" id="next" onclick="nextQ()">Next ➡️</button>
 </div>
</div>

<div id="end" class="hide">
 <div class="card">
  <div class="stars" id="stars"></div>
  <div class="big" id="final"></div>
  <button class="mode" style="background:var(--a)" onclick="start(mode)">🔁 Play Again</button>
  <button class="mode" style="background:var(--b)" onclick="home()">🏠 Choose Another Game</button>
 </div>
</div>
</div>

<script>
var Q=[
// [sentence, answer, type, emoji, hint]
["___ is playing. (Tom)","he","sub","👦","Tom is a boy."],
["Mia has a cat. ___ loves the cat.","she","sub","👧🐱","Mia is a girl."],
["My dog is big. ___ is brown.","it","sub","🐶","A dog is an animal."],
["Ben and I are friends. ___ play together.","we","sub","👦👦","Ben + I = ?"],
["Mom and Dad are home. ___ are cooking.","they","sub","👨‍🍳","Mom + Dad = ?"],
["Anna is my sister. ___ is eight.","she","sub","👧","Anna is a girl."],
["The bird can fly. ___ is blue.","it","sub","🐦","A bird is an animal."],
["___ am a happy student.","I","sub","🙋","This is about me!"],
["Are ___ ready, class?","you","sub","🧑‍🏫","I talk to you."],
["Sam and Lily like ice cream. ___ eat it.","they","sub","🍦","Sam + Lily = ?"],
["Look at Tom. Help ___.","him","obj","🆘","Tom is a boy."],
["Mia is sad. Give ___ a hug.","her","obj","🤗","Mia is a girl."],
["The cat is hungry. Feed ___.","it","obj","🐱🍚","A cat is an animal."],
["Mom calls Ben and me. She calls ___.","us","obj","📞","Ben + me = ?"],
["The kids are loud. Listen to ___.","them","obj","📢","Many kids."],
["Please give the pencil to ___. (I)","me","obj","✏️","Give it to I → ?"],
["Mr. Dan is kind. I thank ___.","him","obj","🙏","Mr. Dan is a man."],
["The ball is red. Kick ___.","it","obj","⚽","A ball is a thing."],
["This gift is for ___. (you)","you","obj","🎁","I talk to you."],
["Ms. Rina is nice. We like ___.","her","obj","👩‍🏫","Ms. Rina is a woman."]
];
var SUBW=["I","he","she","we","they"],OBJW=["me","him","her","us","them"];
var mode="mix",P=1,qs=[],i=0,score=0,streak=0,locked=false,team=0,ts=[0,0],good=0;
function setP(n){P=n;document.getElementById("p1").className=n==1?"on":"";document.getElementById("p2").className=n==2?"on":""}
function show(id){["home","game","end"].forEach(function(x){document.getElementById(x).classList.toggle("hide",x!=id)})}
function home(){show("home")}
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function start(m){
 mode=m;var pool=Q.filter(function(q){return m=="mix"||q[2]==m});
 qs=sh(pool).slice(0,10);i=0;score=0;streak=0;team=0;ts=[0,0];good=0;
 document.getElementById("teams").classList.toggle("hide",P==1);
 show("game");render();
}
function cap(w,s){return s.indexOf("___")===0?w.charAt(0).toUpperCase()+w.slice(1):w}
function render(){
 locked=false;var q=qs[i];
 document.getElementById("qn").textContent=(i+1)+"/"+qs.length;
 document.getElementById("bar").style.width=(i/qs.length*100)+"%";
 document.getElementById("emo").textContent=q[3];
 document.getElementById("sent").innerHTML=q[0].replace("___",'<span class="blank" id="bl">&nbsp;?&nbsp;</span>');
 document.getElementById("hint").textContent="💡 "+q[4];
 document.getElementById("msg").textContent="";
 document.getElementById("next").style.display="none";
 var dist=sh(q[2]=="sub"?OBJW:SUBW).filter(function(w){return w.toLowerCase()!=q[1].toLowerCase()}).slice(0,3);
 var opts=sh([q[1]].concat(dist)),box=document.getElementById("opts");box.innerHTML="";
 opts.forEach(function(w,k){var b=document.createElement("button");b.className="opt o"+k;b.textContent=cap(w,q[0]);b.onclick=function(){pick(b,w)};box.appendChild(b)});
 if(P==2){document.getElementById("tA").classList.toggle("act",team==0);document.getElementById("tB").classList.toggle("act",team==1);
  document.getElementById("hint").textContent+="  👉 "+(team?"Team B":"Team A")+"'s turn!"}
}
function pick(b,w){
 if(locked)return;locked=true;var q=qs[i],ok=w==q[1],bl=document.getElementById("bl");
 var btns=document.querySelectorAll(".opt");
 btns.forEach(function(x){x.disabled=true;if(x.textContent.toLowerCase()==q[1].toLowerCase())x.classList.add("right")});
 bl.textContent=cap(q[1],q[0]);
 if(ok){
  good++;streak++;var pts=10+(streak>2?5:0);
  if(P==2)ts[team]+=pts;else score+=pts;
  bl.classList.add("ok");
  document.getElementById("msg").textContent=["🎉 Great job!","⭐ Super!","👏 Awesome!","🌟 You got it!"][Math.floor(Math.random()*4)]+(streak>2?" 🔥 Bonus!":"");
  boom(b);
 }else{
  streak=0;b.classList.add("wrong");
  document.getElementById("msg").textContent="Oops! The answer is “"+cap(q[1],q[0])+"”. Try the next one! 💪";
 }
 document.getElementById("score").textContent="⭐ "+(P==2?ts[0]+ts[1]:score);
 document.getElementById("streak").textContent="🔥 "+streak;
 document.getElementById("sA").textContent=ts[0];document.getElementById("sB").textContent=ts[1];
 var n=document.getElementById("next");n.style.display="inline-block";
 n.textContent=i==qs.length-1?"See Results 🏆":"Next ➡️";
}
function nextQ(){i++;if(P==2)team=1-team;if(i>=qs.length)finish();else render()}
function finish(){
 show("end");var n=qs.length,s=good/n;
 document.getElementById("stars").textContent=s>=.9?"🏆⭐⭐⭐":s>=.6?"⭐⭐":"⭐";
 var t;
 if(P==2){t=ts[0]==ts[1]?"🤝 It’s a tie! "+ts[0]+" – "+ts[1]:(ts[0]>ts[1]?"🔴 Team A wins!":"🔵 Team B wins!")+" ("+ts[0]+" – "+ts[1]+")"}
 else t="You got "+good+" out of "+n+" right!<br>Score: "+score+" points";
 document.getElementById("final").innerHTML=t+(s>=.9?"<br>🎊 Pronoun Champion!":s>=.6?"<br>👍 Nice work!":"<br>💪 Keep practicing!");
 for(var k=0;k<4;k++)setTimeout(function(){boom(document.getElementById("stars"))},k*250);
}
function boom(el){
 var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,E=["🎈","⭐","🎉","✨","🌈","💖"];
 for(var k=0;k<12;k++){var s=document.createElement("span");s.className="pop";s.textContent=E[k%E.length];
  s.style.left=cx+"px";s.style.top=cy+"px";
  s.style.setProperty("--x",(Math.random()*300-150)+"px");s.style.setProperty("--y",(-Math.random()*220-30)+"px");
  document.body.appendChild(s);setTimeout(function(e){e.remove()},1000,s)}
}
</script>
</body></html>
